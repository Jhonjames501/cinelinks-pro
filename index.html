<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLinks Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #e50914; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #e50914; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b20710; }
        .hidden { display: none; }
        .menu { display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .menu-item { background: #2a2a2a; padding: 15px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .menu-item:hover { background: #3a3a3a; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout { background: #444; width: auto; padding: 5px 10px; font-size: 12px; margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANTALLA DE LOGIN -->
        <div id="login-screen">
            <h1>CineLinks Pro</h1>
            <p style="color: #b3b3b3; margin-bottom: 15px;">Inicia sesión para continuar</p>
            <input type="text" id="username" placeholder="Usuario o Correo">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
        </div>

        <!-- PANTALLA DE LA APP / MENÚ -->
        <div id="app-screen" class="hidden">
            <div class="top-bar">
                <h2 style="color: #e50914; font-size: 20px;">CineLinks Pro</h2>
                <button class="logout" onclick="logout()">Salir</button>
            </div>
            <div class="menu">
                <div class="menu-item" onclick="alert('Abriendo sección de Películas...')">🎬 Películas y Estrenos <span>›</span></div>
                <div class="menu-item" onclick="alert('Abriendo Series...')">📺 Series y Animes <span>›</span></div>
                <div class="menu-item" onclick="alert('Cargando tus Favoritos...')">⭐ Mis Favoritos <span>›</span></div>
                <div class="menu-item" onclick="alert('Configuración de cuenta')">⚙️ Configuración <span>›</span></div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            var user = document.getElementById('username').value;
            if(user.trim() !== "") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
            } else {
                alert("Por favor ingresa un usuario");
            }
        }
        function logout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }
    </script>

</body>
</html>
