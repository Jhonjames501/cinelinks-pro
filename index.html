<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Fire: Survival</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        .screen { display: none; width: 100%; height: 100%; max-width: 480px; padding: 20px; flex-direction: column; justify-content: space-between; position: absolute; top: 0; background: #0b0f19; }
        .screen.active { display: flex; }

        /* Pantalla de Carga / Inicio */
        #splash-screen { justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle, #1a1f2c 0%, #05070a 100%); }
        .logo-title { font-size: 32px; font-weight: 900; color: #e50914; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(229,9,20,0.5); }
        .logo-subtitle { font-size: 14px; color: #8c9bae; margin-bottom: 30px; letter-spacing: 4px; }

        /* Botones generales estilo militar/gaming */
        .btn-tactical { width: 100%; padding: 15px; background: linear-gradient(135deg, #e50914, #b20710); border: none; color: white; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 15px rgba(229,9,20,0.4); margin-bottom: 12px; transition: 0.2s; }
        .btn-tactical:active { transform: scale(0.97); }
        .btn-secondary { background: #1f293d; border: 1px solid #374151; box-shadow: none; }

        /* Lobby Principal */
        .lobby-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 15px; }
        .player-info h3 { font-size: 16px; color: #f3f4f6; }
        .player-info span { font-size: 12px; color: #10b981; }
        
        .lobby-menu { display: flex; flex-direction: column; gap: 10px; margin: auto 0; }
        
        /* Zona de Juego */
        .game-container { background: #111827; border: 2px solid #374151; border-radius: 8px; height: 320px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; margin: auto 0; }
        .game-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 4px; }
        #battle-area { width: 100%; height: 220px; position: relative; background: linear-gradient(to bottom, #1f293d 0%, #111827 70%, #030712 100%); border-bottom: 3px solid #e50914; }
        #player-avatar { position: absolute; bottom: 5px; left: 30px; font-size: 28px; }
        #enemy-target { position: absolute; bottom: 5px; right: -40px; font-size: 28px; transition: right 2s linear; }
        
        .back-link { background: transparent; border: none; color: #9ca3af; font-size: 14px; cursor: pointer; text-align: left; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INICIO / LOGO DEL JUEGO -->
    <div id="splash-screen" class="screen active">
        <div>
            <div style="font-size: 60px; margin-bottom: 15px;">🪖</div>
            <h1 class="logo-title">Battle Fire</h1>
            <p class="logo-subtitle">Survival Ops</p>
        </div>
        <div style="width: 100%; max-width: 300px;">
            <button class="btn-tactical" onclick="showScreen('lobby-screen')">🎮 Entrar al Juego</button>
        </div>
    </div>

    <!-- 2. LOBBY PRINCIPAL -->
    <div id="lobby-screen" class="screen">
        <div class="lobby-header">
            <div class="player-info">
                <h3>Soldado_01</h3>
                <span>● En Línea (Zona Segura)</span>
            </div>
            <div style="font-size: 18px;">⭐ 1,250</div>
        </div>

        <div class="lobby-menu">
            <button class="btn-tactical" onclick="showScreen('game-screen'); iniciarPartida();">🔥 Iniciar Partida Clásica</button>
            <button class="btn-tactical btn-secondary" onclick="alert('Módulo de Armería en desarrollo...')">🔫 Armería y Skins</button>
            <button class="btn-tactical btn-secondary" onclick="alert('Configuración de controles guardada.')">⚙️ Ajustes</button>
        </div>

        <div style="text-align: center; color: #4b5563; font-size: 11px;">
            Battle Fire v1.0 • Engine Mobile Ready
        </div>
    </div>

    <!-- 3. PANTALLA DEL MINIJUEGO DE SUPERVIVENCIA -->
    <div id="game-screen" class="screen">
        <button class="back-link" onclick="showScreen('lobby-screen')">← Volver al Lobby</button>
        
        <div class="game-container">
            <div class="game-hud">
                <span id="score-txt">🎯 Eliminaciones: 0</span>
                <span style="color: #e50914;">● ZONA ACTIVA</span>
            </div>
            
            <div id="battle-area" onclick="atacarEnemigo()">
                <div id="player-avatar">🪖</div>
                <div id="enemy-target">🎯</div>
            </div>
            
            <button class="btn-tactical" onclick="atacarEnemigo()" style="margin: 0; border-radius: 0; padding: 18px; font-size: 18px;">💥 ¡DISPARAR! 💥</button>
        </div>

        <p style="text-align: center; font-size: 12px; color: #9ca3af; margin-top: 10px;">Toca la pantalla o el botón rojo cuando el enemigo esté cerca.</p>
    </div>

    <script>
        let kills = 0;
        let gameActive = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId !== 'game-screen') {
                gameActive = false;
            }
        }

        function iniciarPartida() {
            kills = 0;
            gameActive = true;
            document.getElementById("score-txt").innerText = "🎯 Eliminaciones: 0";
            moverEnemigo();
        }

        function moverEnemigo() {
            if (!gameActive) return;
            let enemy = document.getElementById("enemy-target");
            enemy.style.transition = "none";
            enemy.style.right = "-40px";
            
            setTimeout(() => {
                if (!gameActive) return;
                enemy.style.transition = "right 1.8s linear";
                enemy.style.right = "340px";
            }, 100);
        }

        function atacarEnemigo() {
            if (!gameActive) return;
            let enemy = document.getElementById("enemy-target");
            let rightPos = parseInt(window.getComputedStyle(enemy).getPropertyValue("right"));
            
            // Rango de impacto del disparo
            if (rightPos >= 140 && rightPos >= 260 || (rightPos >= 150 && rightPos <= 260)) {
                kills++;
                document.getElementById("score-txt").innerText = "🎯 Eliminaciones: " + kills;
                moverEnemigo();
            }
        }
    </script>
</body>
</html>
