<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMBIE SURVIVAL: OUTBREAK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { 
            background: #050508; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            max-width: 480px; 
            padding: 15px; 
            flex-direction: column; 
            justify-content: space-between; 
            position: absolute; 
            top: 0; 
            background: #090d16;
            border: 1px solid #1e293b;
        }
        .screen.active { display: flex; }

        /* Pantalla de Inicio / Menú */
        #menu-screen { 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            background: radial-gradient(circle at center, #1a0305 0%, #050508 80%);
        }
        .title { 
            font-size: 34px; 
            font-weight: 900; 
            color: #ef4444; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 0 0 15px rgba(239,68,68,0.7);
            margin-bottom: 5px;
        }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 5px; margin-bottom: 30px; }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(239,68,68,0.4);
            margin-bottom: 10px;
        }
        .btn-main:active { transform: scale(0.97); background: #dc2626; }

        /* Pantalla del Mapa Abierto */
        .game-header {
            display: flex;
            justify-content: space-between;
            background: #111827;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border-left: 4px solid #ef4444;
        }

        /* Mapa Abierto (Área de juego 2D cenital) */
        #map-container {
            width: 100%;
            height: 280px;
            background: #111c14; 
            border: 2px solid #374151;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Personaje y Zombies con cuerpo completo */
        .entity {
            position: absolute;
            font-size: 24px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
        }

        /* Controles de Movimiento */
        .controls-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 0 auto;
        }
        .ctrl-btn {
            background: #1f293d;
            border: 1px solid #475569;
            color: white;
            font-size: 16px;
            padding: 12px 0;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .ctrl-btn:active { background: #334155; }
        .fire-action-btn {
            grid-column: span 3;
            background: #ef4444;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .fire-action-btn:active { background: #dc2626; }

        .back-link { background: none; border: none; color: #64748b; font-size: 11px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

    <!-- 1. MENÚ PRINCIPAL -->
    <div id="menu-screen" class="screen active">
        <div>
            <div style="font-size: 55px; margin-bottom: 10px;">🧟‍♂️</div>
            <h1 class="title">Zombie Outbreak</h1>
            <p class="subtitle">Survival Map v1.1</p>
        </div>
        <div style="width: 100%; max-width: 300px;">
            <button class="btn-main" onclick="startGame()">🎮 Iniciar Supervivencia</button>
            <button class="btn-main" style="background: #1f293d; border: 1px solid #374151;" onclick="shareApp()">🔗 Compartir App</button>
        </div>
    </div>

    <!-- 2. MAPA ABIERTO Y JUEGO -->
    <div id="game-screen" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="back-link" onclick="stopGame(); showScreen('menu-screen')">◄ Salir al Menú</button>
            <span id="game-status" style="font-size: 11px; color: #22c55e;">● ZONA SEGURA</span>
        </div>

        <div class="game-header">
            <span id="score-txt">Zombies abatidos: 0</span>
            <span id="hp-txt" style="color: #ef4444;">Salud: 100%</span>
        </div>

        <!-- El Mapa -->
        <div id="map-container">
            <!-- Soldado de cuerpo completo con arma -->
            <div id="player" class="entity" style="left: 50%; top: 50%;">🏃‍♂️</div>
            <!-- Zombie -->
            <div id="zombie" class="entity" style="left: 10%; top: 10%;">🧟</div>
        </div>

        <!-- Controles de Movimiento -->
        <div class="controls-area">
            <div></div>
            <button class="ctrl-btn" onclick="movePlayer(0, -15)">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="movePlayer(-15, 0)">◄</button>
            <button class="ctrl-btn" onclick="movePlayer(0, 15)">▼</button>
            <button class="ctrl-btn" onclick="movePlayer(15, 0)">►</button>
            <button class="fire-action-btn" onclick="fireWeapon()">💥 DISPARAR</button>
        </div>
    </div>

    <script>
        let pX = 200, pY = 140; 
        let zX = 50, zY = 50;   
        let score = 0;
        let health = 100;
        let gameInterval;
        let isPlaying = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            pX = 200; pY = 140;
            score = 0;
            health = 100;
            isPlaying = true;
            document.getElementById("score-txt").innerText = "Zombies abatidos: 0";
            document.getElementById("hp-txt").innerText = "Salud: 100%";
            
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 80);
        }

        function stopGame() {
            isPlaying = false;
            clearInterval(gameInterval);
        }

        function movePlayer(dx, dy) {
            if (!isPlaying) return;
            pX += dx;
            pY += dy;
            
            if (pX < 15) pX = 15;
            if (pX > 385) pX = 385;
            if (pY < 15) pY = 15;
            if (pY > 265) pY = 265;
            
            updatePositions();
        }

        function updateGame() {
            if (!isPlaying) return;

            if (zX < pX) zX += 3;
            if (zX > pX) zX -= 3;
            if (zY < pY) zY += 3;
            if (zY > pY) zY -= 3;

            let distancia = Math.hypot(pX - zX, pY - zY);
            if (distancia < 20) {
                health -= 5;
                document.getElementById("hp-txt").innerText = "Salud: " + health + "%";
                if (health <= 0) {
                    alert("¡Has sido devorado por los zombies! Fin de la partida.");
                    stopGame();
                    showScreen('menu-screen');
                }
            }

            updatePositions();
        }

        function updatePositions() {
            let playerEl = document.getElementById("player");
            let zombieEl = document.getElementById("zombie");
            playerEl.style.left = pX + "px";
            playerEl.style.top = pY + "px";
            zombieEl.style.left = zX + "px";
            zombieEl.style.top = zY + "px";
        }

        function fireWeapon() {
            if (!isPlaying) return;
            
            let distancia = Math.hypot(pX - zX, pY - zY);
            if (distancia < 90) {
                score++;
                document.getElementById("score-txt").innerText = "Zombies abatidos: " + score;
                zX = Math.random() > 0.5 ? 20 : 380;
                zY = Math.random() > 0.5 ? 20 : 250;
            }
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'Zombie Outbreak', text: '¡Juega a mi juego de supervivencia zombie!', url: window.location.href }).catch(() => {});
            } else {
                alert("Enlace copiado: " + window.location.href);
            }
        }
    </script>
</body>
</html>
