<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMBIE SURVIVAL: TACTICAL MAP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { 
            background: #050508; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            max-width: 480px; 
            padding: 15px; 
            flex-direction: column; 
            justify-content: space-between; 
            position: absolute; 
            top: 0; 
            background: #090d16;
            border: 1px solid #1e293b;
        }
        .screen.active { display: flex; }

        #menu-screen { 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            background: radial-gradient(circle at center, #1a0305 0%, #050508 80%);
        }
        .title { 
            font-size: 34px; 
            font-weight: 900; 
            color: #ef4444; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 0 0 15px rgba(239,68,68,0.7);
            margin-bottom: 5px;
        }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 5px; margin-bottom: 30px; }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(239,68,68,0.4);
            margin-bottom: 10px;
        }
        .btn-main:active { transform: scale(0.97); background: #dc2626; }

        .game-header {
            display: flex;
            justify-content: space-between;
            background: #111827;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border-left: 4px solid #ef4444;
        }

        /* Mapa Abierto con Obstáculos */
        #map-container {
            width: 100%;
            height: 270px;
            background: #111c14; 
            border: 2px solid #374151;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .entity {
            position: absolute;
            font-size: 24px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
        }

        /* Obstáculos en el mapa (Paredes / Cajas) */
        .obstacle {
            position: absolute;
            background: #292524;
            border: 1px solid #57534e;
            border-radius: 3px;
        }

        .controls-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 0 auto;
        }
        .ctrl-btn {
            background: #1f293d;
            border: 1px solid #475569;
            color: white;
            font-size: 16px;
            padding: 12px 0;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .ctrl-btn:active { background: #334155; }
        .fire-action-btn {
            grid-column: span 3;
            background: #ef4444;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .fire-action-btn:active { background: #dc2626; }

        .back-link { background: none; border: none; color: #64748b; font-size: 11px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <div>
            <div style="font-size: 55px; margin-bottom: 10px;">🧟‍♂️</div>
            <h1 class="title">Zombie Outbreak</h1>
            <p class="subtitle">Tactical Map v1.2</p>
        </div>
        <div style="width: 100%; max-width: 300px;">
            <button class="btn-main" onclick="startGame()">🎮 Iniciar Supervivencia</button>
            <button class="btn-main" style="background: #1f293d; border: 1px solid #374151;" onclick="shareApp()">🔗 Compartir App</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="back-link" onclick="stopGame(); showScreen('menu-screen')">◄ Salir al Menú</button>
            <span id="game-status" style="font-size: 11px; color: #22c55e;">● ZONA DE COMBATE</span>
        </div>

        <div class="game-header">
            <span id="score-txt">Zombies abatidos: 0</span>
            <span id="hp-txt" style="color: #ef4444;">Salud: 100%</span>
        </div>

        <!-- Mapa con Obstáculos -->
        <div id="map-container">
            <!-- Obstáculos fijos que bloquean el paso -->
            <div class="obstacle" style="left: 120px; top: 70px; width: 60px; height: 20px;"></div>
            <div class="obstacle" style="left: 240px; top: 160px; width: 20px; height: 70px;"></div>
            <div class="obstacle" style="left: 80px; top: 180px; width: 50px; height: 20px;"></div>

            <!-- Personaje y Zombie -->
            <div id="player" class="entity" style="left: 50%; top: 50%;">🚶‍♂️</div>
            <div id="zombie" class="entity" style="left: 15%; top: 15%;">🧟</div>
        </div>

        <!-- Controles -->
        <div class="controls-area">
            <div></div>
            <button class="ctrl-btn" onclick="movePlayer(0, -12)">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="movePlayer(-12, 0)">◄</button>
            <button class="ctrl-btn" onclick="movePlayer(0, 12)">▼</button>
            <button class="ctrl-btn" onclick="movePlayer(12, 0)">►</button>
            <button class="fire-action-btn" onclick="fireWeapon()">💥 DISPARAR</button>
        </div>
    </div>

    <script>
        let pX = 200, pY = 130; 
        let zX = 40, zY = 40;   
        let score = 0;
        let health = 100;
        let gameInterval;
        let isPlaying = false;
        let legAnim = false;

        const obstacles = [
            { x1: 120, x2: 180, y1: 70, y2: 90 },
            { x1: 240, x2: 260, y1: 160, y2: 230 },
            { x1: 80, x2: 130, y1: 180, y2: 200 }
        ];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            pX = 200; pY = 130;
            zX = 40; zY = 40;
            score = 0;
            health = 100;
            isPlaying = true;
            document.getElementById("score-txt").innerText = "Zombies abatidos: 0";
            document.getElementById("hp-txt").innerText = "Salud: 100%";
            
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 80);
        }

        function stopGame() {
            isPlaying = false;
            clearInterval(gameInterval);
        }

        function checkCollision(x, y) {
            // Bordes del mapa
            if (x < 15 || x > 385 || y < 15 || y > 255) return true;
            // Obstáculos
            for (let obs of obstacles) {
                if (x >= obs.x1 - 10 && x <= obs.x2 + 10 && y >= obs.y1 - 10 && y <= obs.y2 + 10) {
                    return true;
                }
            }
            return false;
        }

        function movePlayer(dx, dy) {
            if (!isPlaying) return;
            
            let nextX = pX + dx;
            let nextY = pY + dy;

            if (!checkCollision(nextX, nextY)) {
                pX = nextX;
                pY = nextY;
            }

            // Animación alterna de piernas al caminar
            legAnim = !legAnim;
            document.getElementById("player").innerText = legAnim ? "🏃‍♂️" : "🚶‍♂️";

            updatePositions();
        }

        function updateGame() {
            if (!isPlaying) return;

            // IA del zombie esquivando ligeramente o moviéndose hacia ti
            let zDx = 0, zDy = 0;
            if (zX < pX) zDx = 2.5;
            if (zX > pX) zDx = -2.5;
            if (zY < pY) zDy = 2.5;
            if (zY > pY) zDy = -2.5;

            // Mover en X y comprobar obstáculos
            if (!checkCollision(zX + zDx, zY)) zX += zDx;
            // Mover en Y y comprobar obstáculos
            if (!checkCollision(zX, zY + zDy)) zY += zDy;

            let distancia = Math.hypot(pX - zX, pY - zY);
            if (distancia < 22) {
                health -= 4;
                document.getElementById("hp-txt").innerText = "Salud: " + health + "%";
                if (health <= 0) {
                    alert("¡Te han atrapado! Fin de la partida.");
                    stopGame();
                    showScreen('menu-screen');
                }
            }

            updatePositions();
        }

        function updatePositions() {
            document.getElementById("player").style.left = pX + "px";
            document.getElementById("player").style.top = pY + "px";
            document.getElementById("zombie").style.left = zX + "px";
            document.getElementById("zombie").style.top = zY + "px";
        }

        function fireWeapon() {
            if (!isPlaying) return;
            
            let distancia = Math.hypot(pX - zX, pY - zY);
            if (distancia < 85) {
                score++;
                document.getElementById("score-txt").innerText = "Zombies abatidos: "+ score;
                // Reaparecer zombie lejos
                zX = Math.random() > 0.5 ? 30 : 360;
                zY = Math.random() > 0.5 ? 30 : 230;
            }
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'Zombie Outbreak', text: '¡Juega a mi juego táctico!', url: window.location.href }).catch(() => {});
            } else {
                alert("Enlace copiado: " + window.location.href);
            }
        }
    </script>
</body>
</html>
