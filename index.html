<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTLE FIRE: SURVIVAL OPS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { 
            background: #020408; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            max-width: 480px; 
            padding: 20px; 
            flex-direction: column; 
            justify-content: space-between; 
            position: absolute; 
            top: 0; 
            background: linear-gradient(135deg, #080d16 0%, #020408 100%);
            border: 1px solid rgba(229, 9, 20, 0.2);
        }
        .screen.active { display: flex; }

        /* Pantalla Splash Realista */
        #splash-screen { 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            background: radial-gradient(circle at center, #150203 0%, #020408 80%);
        }
        .game-logo {
            font-size: 38px;
            font-weight: 900;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(229,9,20,0.8), 0 0 10px #000;
            border-bottom: 2px solid #e50914;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }
        .game-sub {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* Botones Estilo Militar Táctico */
        .btn-military {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #1a0203 0%, #e50914 50%, #1a0203 100%);
            background-size: 200% auto;
            border: 1px solid #ff4d4d;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(229,9,20,0.4);
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .btn-military:active { transform: scale(0.96); filter: brightness(1.2); }
        .btn-military.secondary {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: #cbd5e1;
            box-shadow: none;
        }

        /* Lobby Táctico */
        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 15px;
            border-left: 4px solid #e50914;
            border-radius: 4px;
        }
        .profile-name { font-weight: bold; font-size: 14px; color: #f8fafc; letter-spacing: 1px; }
        .profile-status { font-size: 10px; color: #22c55e; }

        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }

        /* Área de Combate Realista */
        .combat-zone {
            background: radial-gradient(circle at center, #1e0507 0%, #05070a 100%);
            border: 2px solid #334155;
            border-radius: 4px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            margin: auto 0;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #battlefield {
            width: 100%;
            height: 210px;
            position: relative;
            background: linear-gradient(to bottom, rgba(30,41,59,0.4) 0%, rgba(15,23,42,0.8) 70%, #020408 100%);
            border-bottom: 2px solid #e50914;
        }
        #operator { position: absolute; bottom: 8px; left: 35px; font-size: 26px; filter: drop-shadow(0 0 5px rgba(229,9,20,0.6)); }
        #hostile { position: absolute; bottom: 8px; right: -40px; font-size: 26px; transition: right 1.6s linear; filter: drop-shadow(0 0 5px rgba(255,0,0,0.8)); }

        .btn-fire {
            width: 100%;
            padding: 16px;
            background: #e50914;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-fire:active { background: #b20710; }

        .back-btn { background: none; border: none; color: #64748b; font-size: 12px; cursor: pointer; text-align: left; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="splash-screen" class="screen active">
        <div>
            <div style="font-size: 55px; margin-bottom: 10px; filter: drop-shadow(0 0 10px #e50914);">⚡</div>
            <h1 class="game-logo">Battle Fire</h1>
            <p class="game-sub">Tactical Ops v2.4</p>
        </div>
        <div style="width: 100%; max-width: 320px;">
            <button class="btn-military" onclick="showScreen('lobby-screen')">[ INICIAR SISTEMA ]</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen">
        <div class="lobby-top">
            <div>
                <div class="profile-name">OPERATIVE #774</div>
                <div class="profile-status">● SERVIDOR SEGURO: ACTIVO</div>
            </div>
            <div style="font-size: 13px; color: #fbbf24; font-weight: bold;">🪙 9,840</div>
        </div>

        <div class="menu-grid">
            <button class="btn-military" onclick="showScreen('game-screen'); startBattle();">🔥 MODO CLÁSICO (ZONA ROJA)</button>
            <button class="btn-military secondary" onclick="alert('Armería bloqueada: Requiere Rango Oro.')">⚙️ CONFIGURACIÓN Y ARMERÍA</button>
            <button class="btn-military secondary" onclick="compartirAPK()">🔗 COMPARTIR APLICACIÓN APK</button>
        </div>

        <div style="text-align: center; color: #334155; font-size: 10px; letter-spacing: 2px;">
            SECURE ACCESS • MILITARY GRADE ENCRYPTION
        </div>
    </div>

    <div id="game-screen" class="screen">
        <button class="back-btn" onclick="showScreen('lobby-screen')">◄ REGRESAR AL LOBBY</button>
        
        <div class="combat-zone">
            <div class="hud-top">
                <span id="kills-display" style="color: #38bdf8;">BAJAS: 0</span>
                <span style="color: #ef4444; animation: pulse 1s infinite;">● ZONA DE PELIGRO</span>
            </div>
            
            <div id="battlefield" onclick="triggerShot()">
                <div id="operator">🪖</div>
                <div id="hostile">🎯</div>
            </div>
            
            <button class="btn-fire" onclick="triggerShot()">💥 FUEGO / DISPARAR 💥</button>
        </div>

        <p style="text-align: center; font-size: 11px; color: #64748b;">Toca la zona de combate o el botón rojo para abatir al objetivo.</p>
    </div>

    <script>
        let totalKills = 0;
        let inCombat = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id !== 'game-screen') inCombat = false;
        }

        function startBattle() {
            totalKills = 0;
            inCombat = true;
            document.getElementById("kills-display").innerText = "BAJAS: 0";
            deployHostile();
        }

        function deployHostile() {
            if (!inCombat) return;
            let target = document.getElementById("hostile");
            target.style.transition = "none";
            target.style.right = "-40px";
            
            setTimeout(() => {
                if (!inCombat) return;
                target.style.transition = "right 1.4s linear";
                target.style.right = "340px";
            }, 80);
        }

        function triggerShot() {
            if (!inCombat) return;
            let target = document.getElementById("hostile");
            let pos = parseInt(window.getComputedStyle(target).getPropertyValue("right"));
            
            // Rango de impacto táctico
            if (pos >= 130 && pos <= 270) {
                totalKills++;
                document.getElementById("kills-display").innerText = "BAJAS: " + totalKills;
                deployHostile();
            }
        }

        function compartirAPK() {
            if (navigator.share) {
                navigator.share({
                    title: 'Battle Fire Survival',
                    text: '¡Instala mi app de supervivencia táctica!',
                    url: window.location.href
                }).catch(() => {});
            } else {
                alert("Enlace copiado para compartir: " + window.location.href);
            }
        }
    </script>
</body>
</html>
